name: Loop Server Worker
on:
  workflow_run:
    workflows: ["Run Server Script"]
    types:
      - completed

# THIS BLOCK IS REQUIRED: It explicitly grants the token permission to trigger actions
permissions:
  actions: write
  contents: write

jobs:
  trigger-next-run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger main workflow to run again
        run: |
          gh workflow run "Run Server Script" \
            --repo ${{ github.repository }} \
            --ref ${{ github.event.workflow_run.head_branch }}
        env:
          GH_TOKEN: ${{ github.token }}
