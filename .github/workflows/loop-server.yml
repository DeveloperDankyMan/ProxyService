name: Loop Server Worker
on:
  workflow_run:
    workflows: ["Run Server Script"]
    types:
      - completed

jobs:
  trigger-next-run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger main workflow to run again
        run: |
          # Explicitly passing the repository fixes the "not a git repository" error
          gh workflow run "Run Server Script" \
            --repo ${{ github.repository }} \
            --ref ${{ github.event.workflow_run.head_branch }}
        env:
          GH_TOKEN: ${{ github.token }}
